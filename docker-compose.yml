  #       condition: service_healthy
  #   networks:
  #     - trading-network
  #
  # notification-service:
  #   build: ./services/notification-service
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - trading-network

networks:
  trading-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
