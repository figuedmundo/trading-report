services:
  postgres:
    build: ./database
    restart: unless-stopped
    container_name: trading-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trading_reports}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      N8N_DB_USER: ${N8N_DB_USER:-n8n_user}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      TRADING_USER_PASSWORD: ${TRADING_USER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # N8N for workflow orchestration
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    container_name: trading-n8n
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=${NODE_ENV:-production}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${POSTGRES_HOST:-postgres}
      - DB_POSTGRESDB_PORT=${POSTGRES_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-trading_reports}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n_user}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_SECURE_COOKIE=false
      # Notification service credentials
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # SMTP for email notifications
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${EMAIL_PASSWORD}
      - SMTP_FROM=${EMAIL_FROM}
      - EMAIL_TO=${EMAIL_TO}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Email Webhook Service - Security layer for webhook endpoint
  email-webhook:
    build: ./services/email-webhook
    restart: unless-stopped
    container_name: trading-email-webhook
    environment:
      SERVICE_PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://trading_user:${TRADING_USER_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading_reports}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY}
      SIGNATURE_VALIDATION_ENABLED: ${SIGNATURE_VALIDATION_ENABLED:-true}
      MAILGUN_IP_RANGES: ${MAILGUN_IP_RANGES:-149.72.0.0/16,161.38.0.0/16}
      SENDGRID_IP_RANGES: ${SENDGRID_IP_RANGES:-168.245.0.0/16,167.89.0.0/16}
      CUSTOM_ALLOWED_IPS: ${CUSTOM_ALLOWED_IPS:-}
      IP_ALLOWLIST_CACHE_REFRESH_SECONDS: ${IP_ALLOWLIST_CACHE_REFRESH_SECONDS:-300}
      RATE_LIMIT_PER_IP_MINUTE: ${RATE_LIMIT_PER_IP_MINUTE:-5}
      RATE_LIMIT_PER_IP_HOUR: ${RATE_LIMIT_PER_IP_HOUR:-50}
      RATE_LIMIT_GLOBAL_HOUR: ${RATE_LIMIT_GLOBAL_HOUR:-100}
      RATE_LIMIT_BAN_THRESHOLD: ${RATE_LIMIT_BAN_THRESHOLD:-10}
      RATE_LIMIT_BAN_DURATION_HOURS: ${RATE_LIMIT_BAN_DURATION_HOURS:-1}
      RATE_LIMIT_AUTHENTICATED_MULTIPLIER: ${RATE_LIMIT_AUTHENTICATED_MULTIPLIER:-5}
      SECURITY_ALERT_THRESHOLD: ${SECURITY_ALERT_THRESHOLD:-50}
      SECURITY_ALERT_TELEGRAM: ${SECURITY_ALERT_TELEGRAM:-true}
      SECURITY_ALERT_DEBOUNCE_MINUTES: ${SECURITY_ALERT_DEBOUNCE_MINUTES:-10}
      WEBHOOK_SECURITY_ENABLED: ${WEBHOOK_SECURITY_ENABLED:-true}
      SECURITY_EVENT_RETENTION_DAYS: ${SECURITY_EVENT_RETENTION_DAYS:-90}
    # Ports removed for internal isolation
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/email-webhook/src:/app/src:cached
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Playwright Scraper Service
  playwright-scraper:
    build: ./services/playwright-scraper
    restart: unless-stopped
    container_name: trading-playwright-scraper
    environment:
      TRADING_PORTAL_USERNAME: ${TRADING_PORTAL_USERNAME}
      TRADING_PORTAL_PASSWORD: ${TRADING_PORTAL_PASSWORD}
      SERVICE_PORT: 8002
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PLAYWRIGHT_HEADLESS: "true"
    # Ports removed for internal isolation - conflict free!
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1.5G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AI Analysis Engine Service
  ai-analyzer:
    build: ./services/ai-analyzer
    restart: unless-stopped
    container_name: trading-ai-analyzer
    environment:
      AI_PROVIDER: ${AI_PROVIDER}
      LLM_MODEL: ${LLM_MODEL:-claude-3-5-sonnet-20241022}
      PROMPT_TYPE: ${PROMPT_TYPE:-default}
      ENABLE_ONLINE_SEARCH: ${ENABLE_ONLINE_SEARCH:-false}
      THINKING_BUDGET_TOKENS: ${THINKING_BUDGET_TOKENS:-5000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SERVICE_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ANALYSIS_TIMEOUT: 30
      DATABASE_URL: postgresql://trading_user:${TRADING_USER_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading_reports}
    # Ports removed for internal isolation
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Health Monitoring Service
  health-monitoring:
    build: ./services/health-monitoring
    restart: unless-stopped
    container_name: trading-health-monitoring
    environment:
      SERVICE_PORT: 8003
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://trading_user:${TRADING_USER_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading_reports}
      HEALTH_CHECK_INTERVAL: 60
      HEALTH_CHECK_TIMEOUT: 5
      ALERT_EMAIL_ADMIN: ${ALERT_EMAIL_ADMIN:-admin@example.com}
      ALERT_BATCH_WINDOW: 60
      ALERT_AUTO_RESOLVE_WINDOW: 5
      ERROR_LOG_RETENTION_DAYS: 30
      HEALTH_CHECK_RETENTION_DAYS: 7
      ENABLE_HEALTH_MONITORING: "true"
      EMAIL_WEBHOOK_URL: http://email-webhook:8001
      PLAYWRIGHT_SCRAPER_URL: http://playwright-scraper:8002
      AI_ANALYZER_URL: http://ai-analyzer:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      N8N_URL: http://n8n:5678
    # Ports removed for internal isolation
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./services/health-monitoring/src:/app/src:cached
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Unified Notification Service
  notification-service:
    build: ./services/notification-service
    restart: unless-stopped
    container_name: trading-notification
    environment:
      SERVICE_PORT: 8004
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql://trading_user:${TRADING_USER_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading_reports}
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 10
      SMTP_HOST: gmail-api
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${EMAIL_PASSWORD}
      SENDER_EMAIL: ${EMAIL_FROM}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    # Ports removed for internal isolation
    networks:
      - trading-network
    volumes:
      - ./services/notification-service/credentials.json:/app/credentials.json
      - ./services/notification-service/token.pickle:/app/token.pickle
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Gmail Bridge Service - IMAP polling for Gmail inbox
  gmail-bridge:
    build: ./services/gmail-bridge
    restart: unless-stopped
    container_name: trading-gmail-bridge
    environment:
      SERVICE_PORT: 8005
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      SMTP_USER: ${GMAIL_ADDRESS}
      EMAIL_PASSWORD: ${GMAIL_APP_PASSWORD}
      WEBHOOK_URL: ${GMAIL_WEBHOOK_URL:-http://n8n:5678/webhook/trading-reports}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY}
      POLL_INTERVAL: ${GMAIL_POLL_INTERVAL:-60}
      EMAIL_SEARCH_CRITERIA: ${EMAIL_SEARCH_CRITERIA:-UNSEEN}
      EMAIL_SENDER_FILTER: ${EMAIL_SENDER_FILTER:-}
      MARK_AS_READ: ${MARK_AS_READ:-false}
      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-30}
    # Ports removed for internal isolation
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/gmail-bridge/src:/app/src:cached
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trading-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local